<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% seo %}
</head>
<body>

  <nav class="site-nav">
    <a href="{{ '/' | relative_url }}" class="nav-brand">
      <span class="brand-name">sexcott</span><span class="brand-suffix">@sec:~$</span>
    </a>
    <ul class="nav-links">
      <li><a href="{{ '/blog/' | relative_url }}">Blog</a></li>
      <!--<li><a href="{{ '/writeups/' | relative_url }}">Writeups</a></li>-->
      <li><a href="https://www.linkedin.com/in/angel-figueroa-scott-0723b524b/" target="_blank">LinkedIn</a></li>
    </ul>
  </nav>

  {{ content }}

  <footer class="site-footer">
    <p class="footer-copy"><span>sexcott</span> · {{ 'now' | date: "%Y" }}</p>
    <div class="footer-links">
      <a href="https://www.linkedin.com/in/angel-figueroa-scott-0723b524b/" target="_blank">LinkedIn</a>
      {% if site.author.twitter != "" %}
      <a href="https://twitter.com/{{ site.author.twitter }}" target="_blank">Twitter</a>
      {% endif %}
      {% if site.author.email != "" %}
      <a href="mailto:{{ site.author.email }}">Email</a>
      {% endif %}
    </div>
  </footer>

</body>
</html>
