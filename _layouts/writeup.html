---
layout: default
---
<article>
  <header class="page-header">
    <div class="page-meta">
      <span>{{ page.platform }}</span>
      <span>{{ page.date | date: "%Y-%m-%d" }}</span>
      <span class="diff-{{ page.difficulty | downcase }}">{{ page.difficulty }}</span>
    </div>
    <h1 class="page-title">{{ page.title }}</h1>
    <div class="page-tags">
      {% for tag in page.tags %}
        <span class="tag tag-{{ tag }}">{{ tag }}</span>
      {% endfor %}
    </div>
  </header>

  <div class="prose">
    {{ content }}
  </div>
</article>
